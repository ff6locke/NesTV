name: Build NesTV APK

on:
  push:
    branches: [ main, master ]
    paths:
      - "NesTV.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf project
          unzip -q -o NesTV.zip -d project
          find project -name settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          gradle -p "$DIR" assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$(find project -name app-debug.apk | head -1)" out/NesTV.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: NesTV-apk
          path: out/NesTV.apk

      - name: Publish as a release (direct APK download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NesTV build ${{ github.run_number }}
          prerelease: true
          files: out/NesTV.apk
