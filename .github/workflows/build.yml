name: Build NesTV APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'NesTV.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          test -f NesTV.zip
          mkdir -p extracted
          unzip -oq NesTV.zip -d extracted
          echo "ZIP extracted successfully"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e
          SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "No Gradle settings file found in ZIP."
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build APK
        shell: bash
