name: Build NesTV APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'NesTV.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ZIP
        run: |
          set -e
          test -f NesTV.zip || {
            echo "::error::NesTV.zip not found in repository root"
            exit 1
          }
          mkdir -p extracted
          unzip -oq NesTV.zip -d extracted
          echo "ZIP extracted successfully"

      - name: Find Android Gradle project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found in ZIP."
            echo "ZIP contents:"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Root build.gradle or build.gradle.kts is missing."
            exit
